version: 2

sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.
        config:
          freshness:
            warn_after:
              count: 8
              period: hour
            error_after:
              count: 10
              period: hour
          loaded_at_field: _etl_loaded_at
        

  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment

