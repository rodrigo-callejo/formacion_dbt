version: 2

sources:
  - name: jaffle_shop
    description: This is a replica of the Postgres database used by our app
    config:
      freshness:
        warn_after:
          count: 2
          period: day
        error_after:
          count: 20
          period: day
      loaded_at_field: _etl_loaded_at
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: One record per customer.
        freshness: null
      - name: orders
        description: One record per order. Includes cancelled and deleted orders.

  - name: stripe
    database: raw
    schema: stripe
    tables:
      - name: payment

